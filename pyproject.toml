[project]
name = "glycerin-calculator"
version = "1.0.0"
authors = [{ name = "gabriel-geissler" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "plotly>=7.1.0",
]

[project.scripts]
glycerin-calculator = "glycerin_calculator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glycerin_calculator"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=8",
    "httpx>=0.27"
]
