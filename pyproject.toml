[project]
name = "glycerin-calculator"
version = "0.1.0"
authors = [{ name = "gabriel-geissler" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "plotly>=5.22",
]

[project.scripts]
glycerin-calculator = "glycerin_calculator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glycerin_calculator"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "httpx>=0.27",
]
